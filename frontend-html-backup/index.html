<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Food Waste Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f1f8e9, #e8f5e9);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1b5e20;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #555;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4caf50;
        }

        .predict-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #1b5e20;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: #f5f5f5;
        }

        .result h2 {
            color: #1b5e20;
            margin-bottom: 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .result-box h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-box p {
            font-size: 24px;
            font-weight: bold;
            color: #222;
        }

        .recommendation {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #4caf50;
        }

        .recommendation h3 {
            margin-bottom: 8px;
            color: #333;
        }

        .recommendation p {
            color: #555;
            line-height: 1.6;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #2e7d32;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .form-grid,
            .result-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🍽️ Restaurant Food Waste Predictor</h1>
            <p>
                Predict food waste and get smart recommendations
                using Machine Learning
            </p>
        </div>

        <div class="card">

            <div class="form-grid">

                <div class="form-group">
                    <label>Meals Served</label>
                    <input type="number" id="meals_served" value="300" min="1">
                </div>

                <div class="form-group">
                    <label>Kitchen Staff</label>
                    <input type="number" id="kitchen_staff" value="12" min="1">
                </div>

                <div class="form-group">
                    <label>Temperature (°C)</label>
                    <input type="number" id="temperature_C" value="25">
                </div>

                <div class="form-group">
                    <label>Humidity (%)</label>
                    <input type="number" id="humidity_percent" value="60" min="0" max="100">
                </div>

                <div class="form-group">
                    <label>Day of Week</label>

                    <select id="day_of_week">

                        <option value="0">Monday</option>
                        <option value="1">Tuesday</option>
                        <option value="2">Wednesday</option>
                        <option value="3">Thursday</option>
                        <option value="4">Friday</option>
                        <option value="5" selected>Saturday</option>
                        <option value="6">Sunday</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Special Event</label>

                    <select id="special_event">

                        <option value="0">No</option>
                        <option value="1">Yes</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Past Food Waste (kg)</label>
                    <input type="number" id="past_waste_kg" value="35" min="0">
                </div>

                <div class="form-group">
                    <label>Staff Experience</label>

                    <select id="staff_experience">

                        <option value="beginner">Beginner</option>

                        <option value="intermediate" selected>
                            Intermediate
                        </option>

                        <option value="expert">Expert</option>

                    </select>

                </div>

            </div>

            <button class="predict-btn" onclick="predictWaste()">
                🔮 Predict Food Waste
            </button>

            <div class="loading" id="loading">
                Predicting food waste...
            </div>

            <div class="error" id="error"></div>

            <div class="result" id="result">

                <h2>📊 Prediction Result</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <h3>Predicted Waste</h3>
                        <p id="waste">--</p>
                    </div>

                    <div class="result-box">
                        <h3>Waste Percentage</h3>
                        <p id="percentage">--</p>
                    </div>

                    <div class="result-box">
                        <h3>Risk Level</h3>
                        <p id="risk">--</p>
                    </div>

                </div>

                <div class="recommendation">

                    <h3>💡 Recommendation</h3>

                    <p id="recommendation">
                        --
                    </p>

                </div>

            </div>

        </div>

    </div>


    <script>

        async function predictWaste() {

            const result = document.getElementById("result");
            const error = document.getElementById("error");
            const loading = document.getElementById("loading");

            // Hide previous messages
            result.style.display = "none";
            error.style.display = "none";

            // Show loading
            loading.style.display = "block";

            const data = {

                meals_served:
                    Number(document.getElementById("meals_served").value),

                kitchen_staff:
                    Number(document.getElementById("kitchen_staff").value),

                temperature_C:
                    Number(document.getElementById("temperature_C").value),

                humidity_percent:
                    Number(document.getElementById("humidity_percent").value),

                day_of_week:
                    Number(document.getElementById("day_of_week").value),

                special_event:
                    Number(document.getElementById("special_event").value),

                past_waste_kg:
                    Number(document.getElementById("past_waste_kg").value),

                staff_experience:
                    document.getElementById("staff_experience").value

            };


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Server returned error: " + response.status
                    );

                }


                const prediction = await response.json();


                document.getElementById("waste").innerText =
                    prediction.predicted_food_waste_kg + " kg";


                document.getElementById("percentage").innerText =
                    prediction.waste_percentage + "%";


                document.getElementById("risk").innerText =
                    prediction.risk_level;


                document.getElementById("recommendation").innerText =
                    prediction.recommendation;


                // Risk styling

                const riskElement =
                    document.getElementById("risk");


                if (prediction.risk_level === "HIGH") {

                    riskElement.style.color = "#d32f2f";

                }
                else if (prediction.risk_level === "MEDIUM") {

                    riskElement.style.color = "#f57c00";

                }
                else {

                    riskElement.style.color = "#2e7d32";

                }


                result.style.display = "block";

            }


            catch (err) {

                error.innerText =
                    "Unable to connect to the prediction server. " +
                    "Make sure FastAPI is running on port 8000.";

                error.style.display = "block";

                console.error(err);

            }


            finally {

                loading.style.display = "none";

            }

        }

    </script>

</body>

</html>
